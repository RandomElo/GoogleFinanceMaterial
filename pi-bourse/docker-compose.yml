# Postgres est une ressource partagée, définie dans ../commun/docker-compose.yml.
# Le démarrer avant ce projet : cd ../commun && docker compose up -d

services:
  api:
    build: .
    container_name: bourse-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Heure des crons (18 h 15, 22 h 30, 22 h 45) et date du jour par défaut
      - TZ=Europe/Paris
    ports:
      # Joignable en réseau local et par Tailscale, pas exposé par le tunnel Cloudflare
      - "8140:8140"
    volumes:
      # Clé du compte de service Google (synchro des opérations), non versionnée
      - ./secrets:/app/secrets:ro
    networks:
      - default
      - commun
    # uid de eloi : la clé Google (secrets/, chmod 600) n'est lisible que par lui
    user: "1000:1000"
    init: true
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8140/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  commun:
    external: true
